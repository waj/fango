name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # cmd/fango builds the generated fixture batch and native workers while
      # other packages compile generated projects. This makes even a 30m
      # per-package timeout tight on a shared runner. `go` ignores GOFLAGS
      # entries a subcommand does not accept, so `go vet` is unaffected.
      GOFLAGS: -timeout=45m
    steps:
      - uses: actions/checkout@v4

      # The differential suite builds many generated Go projects. The Ubuntu
      # image's Android SDK is unused here and occupies much of the runner's
      # available disk space.
      - name: Free space for generated Go builds
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android
          df -h /

      # GOTOOLCHAIN=local in internal/build means the runner's own go must
      # satisfy the go directive in go.mod; it will not download a toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # setup-go's cache keys off go.sum, which this dependency-free repo
          # does not have. The build cache is what matters here and is handled
          # below.
          cache: false

      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gobuild-${{ github.sha }}
          restore-keys: ${{ runner.os }}-gobuild-

      - run: make ci
